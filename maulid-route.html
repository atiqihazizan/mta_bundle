<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Route: Maulid</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .stats-panel {
      position: fixed;
      bottom: 24px;
      right: 14px;
      background: rgba(15, 23, 42, 0.93);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px 18px;
      z-index: 1000;
      backdrop-filter: blur(8px);
      min-width: 200px;
      pointer-events: none;
    }

    .stats-panel h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #64748b;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
      font-size: 13px;
      gap: 16px;
    }

    .stat-row .label { color: #94a3b8; white-space: nowrap; }
    .stat-row .value { color: #f1f5f9; font-weight: 700; text-align: right; }
    .stat-row .value.green { color: #22c55e; }

    /* Print button */
    .print-btn {
      position: fixed;
      top: 14px;
      left: 50px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.93);
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      transition: background 0.15s;
    }
    .print-btn:hover { background: #3b82f6; border-color: #3b82f6; }

    /* Zoom control */
    .leaflet-control-zoom {
      border: 1px solid #334155 !important;
      border-radius: 6px !important;
      overflow: hidden;
    }
    .leaflet-control-zoom a {
      background: rgba(15, 23, 42, 0.93) !important;
      color: #e2e8f0 !important;
      border-bottom: 1px solid #334155 !important;
    }
    .leaflet-control-zoom a:hover {
      background: #3b82f6 !important;
      color: #fff !important;
    }

    /* Attribution */
    .leaflet-control-attribution {
      background: rgba(15, 23, 42, 0.7) !important;
      color: #64748b !important;
      font-size: 10px !important;
    }
    .leaflet-control-attribution a { color: #94a3b8 !important; }

    @media print {
      .print-btn { display: none !important; }
      .leaflet-control-zoom,
      .leaflet-control-attribution { display: none !important; }
      .stats-panel {
        background: #fff !important;
        border: 1px solid #999 !important;
        color: #000 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .stats-panel h3 { color: #555 !important; }
      .stat-row .label { color: #555 !important; }
      .stat-row .value { color: #000 !important; }
      .stat-row .value.green { color: #16a34a !important; }
    }
  </style>
</head>
<body>

<div id="map"></div>
<button class="print-btn" id="printBtn">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
    <rect x="6" y="14" width="12" height="8"/>
  </svg>
  Cetak Peta
</button>

<div class="stats-panel">
  <h3>Maklumat Route</h3>
  <div class="stat-row">
    <span class="label">ID</span>
    <span class="value">#100</span>
  </div>
  <div class="stat-row">
    <span class="label">Nama</span>
    <span class="value">Maulid</span>
  </div>
  <div class="stat-row">
    <span class="label">Jumlah Titik</span>
    <span class="value" id="stat-pts">—</span>
  </div>
  <div class="stat-row">
    <span class="label">Jarak (anggaran)</span>
    <span class="value" id="stat-dist">—</span>
  </div>
  <div class="stat-row">
    <span class="label">Status</span>
    <span class="value green">Aktif</span>
  </div>
</div>

<script>
  const routeData = {
    id: 100,
    name: "maulid",
    visible: true,
    coords: [
      [5.388782, 100.464284],
      [5.389380, 100.464381],
      [5.389508, 100.465250],
      [5.390448, 100.464799],
      [5.390501, 100.464295],
      [5.390833, 100.463684],
      [5.391244, 100.463705],
      [5.391292, 100.463271],
      [5.391516, 100.462525],
      [5.391639, 100.461887],
      [5.391890, 100.461849],
      [5.391933, 100.460846],
      [5.391826, 100.460658],
      [5.391030, 100.461211],
      [5.390064, 100.461071],
      [5.386902, 100.460739],
      [5.385791, 100.460497],
      [5.384087, 100.460111],
      [5.383767, 100.460261],
      [5.383623, 100.460556],
      [5.383275, 100.460637],
      [5.383067, 100.460899],
      [5.382838, 100.461055],
      [5.382565, 100.461168],
      [5.382165, 100.461307],
      [5.381823, 100.461463],
      [5.382480, 100.462643],
      [5.383105, 100.463061],
      [5.383163, 100.463340],
      [5.383206, 100.463560],
      [5.383334, 100.463727],
      [5.383350, 100.463893],
      [5.383548, 100.463952],
      [5.383842, 100.464231],
      [5.384920, 100.464435],
      [5.384482, 100.466301],
      [5.384776, 100.466484],
      [5.384766, 100.466650],
      [5.385102, 100.466634],
      [5.385380, 100.466704],
      [5.385609, 100.466747],
      [5.385759, 100.467015],
      [5.386053, 100.467203],
      [5.386063, 100.467449],
      [5.386683, 100.467664],
      [5.387436, 100.467905],
      [5.387692, 100.467321],
      [5.388141, 100.467015],
      [5.388392, 100.466511],
      [5.388515, 100.466028],
      [5.388488, 100.465695],
      [5.388317, 100.465347],
      [5.388269, 100.465175],
      [5.388429, 100.464767],
      [5.388248, 100.464617]
    ]
  };

  function haversine(a, b) {
    const R = 6371;
    const dLat = (b[0] - a[0]) * Math.PI / 180;
    const dLon = (b[1] - a[1]) * Math.PI / 180;
    const s = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(a[0] * Math.PI/180) * Math.cos(b[0] * Math.PI/180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
  }

  function totalDistance(coords) {
    let d = 0;
    for (let i = 1; i < coords.length; i++) d += haversine(coords[i-1], coords[i]);
    return d;
  }

  function centerOf(coords) {
    const lat = coords.reduce((s,c) => s + c[0], 0) / coords.length;
    const lng = coords.reduce((s,c) => s + c[1], 0) / coords.length;
    return [lat, lng];
  }

  const map = L.map('map', { zoomControl: true }).setView(centerOf(routeData.coords), 16);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(map);

  const polyline = L.polyline(routeData.coords, {
    color: '#3b82f6',
    weight: 5,
    opacity: 0.95,
    lineJoin: 'round',
    lineCap: 'round'
  }).addTo(map);

  routeData.coords.forEach((coord, i) => {
    if (i === 0 || i === routeData.coords.length - 1) return;
    if (i % 5 === 0) {
      L.circleMarker(coord, {
        radius: 3,
        color: '#60a5fa',
        fillColor: '#60a5fa',
        fillOpacity: 0.8,
        weight: 0
      }).addTo(map);
    }
  });

  const startIcon = L.divIcon({
    html: `<div style="background:#22c55e;color:#fff;font-size:11px;font-weight:700;
      padding:4px 8px;border-radius:4px;white-space:nowrap;
      box-shadow:0 2px 8px rgba(0,0,0,0.5);">&#9654; MULA</div>`,
    className: '',
    iconAnchor: [0, 12]
  });

  L.marker(routeData.coords[0], { icon: startIcon })
    .addTo(map)
    .bindPopup(`<b>Titik Mula</b><br><small style="font-family:monospace">${routeData.coords[0][0].toFixed(6)}, ${routeData.coords[0][1].toFixed(6)}</small>`);

  const endCoord = routeData.coords[routeData.coords.length - 1];
  const endIcon = L.divIcon({
    html: `<div style="background:#ef4444;color:#fff;font-size:11px;font-weight:700;
      padding:4px 8px;border-radius:4px;white-space:nowrap;
      box-shadow:0 2px 8px rgba(0,0,0,0.5);">&#9632; TAMAT</div>`,
    className: '',
    iconAnchor: [0, 12]
  });

  L.marker(endCoord, { icon: endIcon })
    .addTo(map)
    .bindPopup(`<b>Titik Tamat</b><br><small style="font-family:monospace">${endCoord[0].toFixed(6)}, ${endCoord[1].toFixed(6)}</small>`);

  map.fitBounds(polyline.getBounds(), { padding: [60, 60] });


  const pts = routeData.coords.length;
  const dist = totalDistance(routeData.coords);
  document.getElementById('stat-pts').textContent = pts;
  document.getElementById('stat-dist').textContent =
    dist >= 1 ? dist.toFixed(2) + ' km' : (dist * 1000).toFixed(0) + ' m';

  // Print: fit full route first, wait tiles load, then print
  document.getElementById('printBtn').addEventListener('click', function () {
    const btn = this;
    btn.textContent = 'Sediakan...';
    btn.disabled = true;

    map.fitBounds(polyline.getBounds(), { padding: [40, 40], animate: false });

    map.once('moveend', function () {
      // Wait for tiles to finish rendering
      const waitTiles = setInterval(function () {
        if (document.querySelectorAll('.leaflet-tile-loading').length === 0) {
          clearInterval(waitTiles);
          setTimeout(function () {
            window.print();
            btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Cetak Peta`;
            btn.disabled = false;
          }, 400);
        }
      }, 200);
    });
  });
</script>
</body>
</html>
